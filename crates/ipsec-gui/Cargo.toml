[package]
name = "ipsec-gui"
description = "Cross-platform tray agent and window for the IPsec VPN client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ipsec-gui"
path = "src/main.rs"

[dependencies]
ipc-proto.workspace = true
# Window UI.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# System tray icon + menu.
tray-icon = "0.26"
# Desktop notifications (FR-038).
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon on Linux runs on a GTK main loop (libappindicator).
gtk = "0.18"
