# Releases. Pushing a tag v<version> (matching the workspace version in
# Cargo.toml) builds and tests every installer and publishes them as a GitHub
# release with SHA-256 checksums and generated notes:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A tag with a hyphen (v0.2.0-rc1) makes a prerelease. The macOS package is
# signed and notarized when the Apple secrets are configured (see
# packaging/macos/sign-and-notarize.sh); otherwise it ships unsigned, and the
# release notes say which installers are unsigned.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        id: check
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace --locked
      - name: Wintun
        # The signed driver DLL is not in the repository; pin the release.
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash
          if ($hash -ne '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51') {
            throw "wintun.zip checksum mismatch: $hash"
          }
          Expand-Archive wintun.zip -DestinationPath $env:RUNNER_TEMP
      - name: Build MSI
        shell: pwsh
        run: ./installer/build.ps1 -Wintun "$env:RUNNER_TEMP/wintun/bin/amd64/wintun.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: target/installer/*.msi
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace --locked
      - name: Packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build packages
        run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: sh packaging/macos/build.sh
      - name: Sign and notarize
        id: sign
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          sh packaging/macos/sign-and-notarize.sh | tee sign.log
          if grep -q '^Signed and notarized' sign.log; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            target/macos/*.pkg
            target/macos/*.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          {
            echo "## Installers"
            echo
            echo "- **Windows**: \`IpsecClient-*.msi\` (64-bit, Windows 10/11)"
            echo "- **Linux**: \`.deb\` (Ubuntu 22.04+, Debian 12+) and \`.rpm\` (Fedora 39+)"
            echo "- **macOS**: \`.pkg\` (or the \`.dmg\` holding it), universal, macOS 13+"
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "The Windows MSI and the Linux packages are not signed."
            if [ "$SIGNED" = "true" ]; then
              echo "The macOS package is signed with a Developer ID and notarized."
            else
              echo "The macOS package is not signed: open it with right-click > Open."
            fi
          } > notes.md
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* $flags --verify-tag \
              --title "IPsec Client ${{ needs.version.outputs.version }}" \
              --notes-file notes.md --generate-notes
          fi
