# Continuous integration (002 T038; FR-028–FR-030).
#   windows:   the gates on Windows (service, GUI, PLAP crate), then the MSI.
#   linux:     the gates on Linux incl. the GUI, the root-only TUN test, and
#              the .deb/.rpm packages.
#   linux-e2e: the real client against a real strongSwan gateway in network
#              namespaces (tests/linux-e2e/run.sh).
#   macos-test: the gates on macOS and the root-only utun/route/DNS tests.
#   macos:     the universal installer (.pkg, and a .dmg holding it), then
#              install / upgrade / uninstall on the runner.
# Each packaging job uploads its installer as a build artifact.
name: CI

on:
  push:
    # Feature branches too (e.g. 004-macos-support), so macOS runs without a PR.
    branches: [master, main, '[0-9][0-9][0-9]-*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Wintun
        # The signed driver DLL is not in the repository; pin the release.
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash
          if ($hash -ne '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51') {
            throw "wintun.zip checksum mismatch: $hash"
          }
          Expand-Archive wintun.zip -DestinationPath $env:RUNNER_TEMP
      - name: Build MSI
        shell: pwsh
        run: ./installer/build.ps1 -Wintun "$env:RUNNER_TEMP/wintun/bin/amd64/wintun.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/installer/*.msi
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Root-only tests (TUN device)
        # Build as the runner user, run the binary as root, so `target/`
        # never gets root-owned files.
        run: |
          bin="$(cargo test -p ipsec-service --bin ipsec-service --no-run --locked --message-format=json \
            | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | tail -n 1)"
          sudo "$bin" --ignored linux_tun --test-threads=1
      - name: Packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build packages
        run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

  linux-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: strongSwan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            strongswan-swanctl charon-systemd libcharon-extra-plugins \
            libstrongswan-extra-plugins libstrongswan-standard-plugins \
            libcharon-extauth-plugins iproute2 iputils-ping
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the service and the e2e driver
        id: build
        run: |
          cargo build -p ipsec-service --locked
          driver="$(cargo test -p ipsec-service --test linux_e2e --no-run --locked --message-format=json \
            | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | grep /linux_e2e- | tail -n 1)"
          echo "driver=$driver" >> "$GITHUB_OUTPUT"
      - name: End-to-end against strongSwan
        run: |
          set -o pipefail
          sudo SERVICE_BIN="$PWD/target/debug/ipsec-service" \
               DRIVER_BIN="${{ steps.build.outputs.driver }}" \
               tests/linux-e2e/run.sh 2>&1 | tee e2e.log
      # The key lines as an annotation, which is readable without signing in.
      - name: Summarize the e2e failure
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' e2e.log \
            | grep -E 'panicked|connection failed|ERROR|WARN|not supported|failed|NO_PROP|IKE_|EAP|selected|==>' \
            | grep -v 'opening directory' | tail -n 60 > e2e-summary.txt || true
          msg="$(sed -e 's/%/%25/g' e2e-summary.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=linux-e2e::${msg}"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the package and disk image
        run: sh packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            target/macos/*.pkg
            target/macos/*.dmg
          if-no-files-found: error
      # Install, upgrade, uninstall (profiles kept), reinstall and
      # uninstall --remove-data on the runner (004 T045).
      - name: Package lifecycle
        run: sh tests/macos-e2e/package.sh

  macos-test:
    # 004: gates on Apple Silicon, then the root-only utun/route/DNS tests.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Root-only tests (utun, routes, DNS)
        # Build as the runner user, run the binary as root, so `target/`
        # never gets root-owned files.
        run: |
          bin="$(cargo test -p ipsec-service --bin ipsec-service --no-run --locked --message-format=json \
            | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | tail -n 1)"
          sudo "$bin" --ignored macos_ --test-threads=1
      - name: End-to-end against the mock gateway
        # 004 T021: the real service, a utun, routes and DNS, against the
        # vpn-core mock gateway on a lo0 alias (no strongSwan on macOS).
        run: |
          set -o pipefail
          cargo build -p ipsec-service -p vpn-core --example mock_gateway --locked
          driver="$(cargo test -p ipsec-service --test macos_e2e --no-run --locked --message-format=json \
            | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | grep /macos_e2e- | tail -n 1)"
          sudo SERVICE_BIN="$PWD/target/debug/ipsec-service" \
               GATEWAY_BIN="$PWD/target/debug/examples/mock_gateway" \
               DRIVER_BIN="$driver" \
               tests/macos-e2e/run.sh 2>&1 | tee e2e.log
      - name: Summarize the e2e failure
        if: failure()
        run: |
          [ -f e2e.log ] || exit 0
          grep -E 'panicked|connection failed|ERROR|WARN|failed|missing|==>|delete=' e2e.log \
            | tail -n 60 > e2e-summary.txt || true
          msg="$(sed -e 's/%/%25/g' e2e-summary.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=macos-e2e::${msg}"
