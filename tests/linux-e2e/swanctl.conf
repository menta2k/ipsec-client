# strongSwan gateway for the network-namespace end-to-end test (002 T036,
# research R11). Loaded into charon running in the `vpn-gw` namespace by
# tests/linux-e2e/run.sh with `swanctl --load-all --file <this file>`.
#
#   vpn-cli (10.99.0.2)  ---veth---  vpn-gw (10.99.0.1)  [dummy0 10.99.1.1/24]
#
# The client gets an address from 10.99.2.0/24 and DNS 10.99.1.53, and
# reaches 10.99.1.0/24 through the tunnel. Its forced UDP encapsulation makes
# the gateway see NAT, so ESP runs over UDP 4500 exactly as against the
# FortiGate. The identities and secrets must match
# crates/ipsec-service/tests/linux_e2e.rs.

connections {
    # PSK on both sides (spec US1-5 / 001 US2).
    psk {
        version = 2
        local_addrs = 10.99.0.1
        pools = e2e-pool
        # The client's IKE offers (001 FR-010), most preferred first.
        proposals = aes256gcm16-prfsha384-modp2048-modp1536-curve25519, aes256-sha256-modp2048-modp1536-curve25519, aes128-sha256-modp2048-modp1536-curve25519
        local {
            auth = psk
            id = gw.test
        }
        remote {
            auth = psk
            id = psk-client.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16, aes256-sha256
            }
        }
    }

    # Gateway authenticates with the PSK, the user with EAP-MSCHAPv2 (the
    # FortiGate dialup arrangement the client was built against).
    eap {
        version = 2
        local_addrs = 10.99.0.1
        pools = e2e-pool
        proposals = aes256gcm16-prfsha384-modp2048-modp1536-curve25519, aes256-sha256-modp2048-modp1536-curve25519, aes128-sha256-modp2048-modp1536-curve25519
        local {
            auth = psk
            id = gw.test
        }
        remote {
            auth = eap-mschapv2
            eap_id = %any
            id = eap-client.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16, aes256-sha256
            }
        }
    }
}

pools {
    e2e-pool {
        addrs = 10.99.2.0/24
        dns = 10.99.1.53
    }
}

secrets {
    ike-psk {
        id-gw = gw.test
        id-client = psk-client.test
        secret = "e2e-psk-secret"
    }
    ike-eap {
        id-gw = gw.test
        id-client = eap-client.test
        secret = "e2e-eap-gateway-secret"
    }
    eap-alice {
        id = alice
        secret = "alice-password"
    }
}
